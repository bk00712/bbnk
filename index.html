<script>
// ==================== DATA STORAGE ====================
let usersDB = [];
let transactions = [];
let withdrawRequests = [];
let depositRequests = [];
let transferRequests = [];
let supportTickets = [];
let currentUser = null;

// ==================== LOAD ALL DATA ====================
function loadAllData() {
    usersDB = JSON.parse(localStorage.getItem('citi_bank_users')) || [];
    transactions = JSON.parse(localStorage.getItem('citi_bank_transactions')) || [];
    withdrawRequests = JSON.parse(localStorage.getItem('citi_bank_withdraws')) || [];
    depositRequests = JSON.parse(localStorage.getItem('citi_bank_deposits')) || [];
    transferRequests = JSON.parse(localStorage.getItem('citi_bank_transfers')) || [];
    supportTickets = JSON.parse(localStorage.getItem('citi_bank_tickets')) || [];

    // Create default users if database empty
    if (usersDB.length === 0) {
        usersDB = [
            {
                id: 1,
                name: "System Administrator",
                username: "admin",
                email: "admin@citiroyal.com",
                password: "admin123",
                pin: "0000",
                transPin: "0000",
                role: "admin",
                balance: 0,
                accountNumber: "CRB1000001",
                routing: "760965735",
                swift: "CRIBUS33",
                status: "active",
                currency: "USD",
                avatar: null,
                createdAt: new Date().toISOString()
            }
        ];

        saveAllData();
    }
}

// ==================== SAVE ALL DATA ====================
function saveAllData() {
    localStorage.setItem('citi_bank_users', JSON.stringify(usersDB));
    localStorage.setItem('citi_bank_transactions', JSON.stringify(transactions));
    localStorage.setItem('citi_bank_withdraws', JSON.stringify(withdrawRequests));
    localStorage.setItem('citi_bank_deposits', JSON.stringify(depositRequests));
    localStorage.setItem('citi_bank_transfers', JSON.stringify(transferRequests));
    localStorage.setItem('citi_bank_tickets', JSON.stringify(supportTickets));
}

// ==================== GENERATE ACCOUNT NUMBER ====================
function generateAccountNumber() {
    let acc;

    do {
        acc = "CRB" + Math.floor(100000000 + Math.random() * 900000000);
    } while (usersDB.some(u => u.accountNumber === acc));

    return acc;
}

// ==================== REFRESH USER UI ====================
function refreshUserUI() {
    if (!currentUser) return;

    $('#userNameSpan').text(currentUser.username);
    $('#userFullName').text(currentUser.name);
    $('#userAccount').text(currentUser.accountNumber);
    $('#userCurrency').text(currentUser.currency);

    let symbol = '$';

    if (currentUser.currency === 'EUR') symbol = '€';
    if (currentUser.currency === 'GBP') symbol = '£';

    $('#userCurrencySymbol').text(symbol);
    $('#userBalance').text(parseFloat(currentUser.balance).toFixed(2));

    let avatar =
        currentUser.avatar ||
        'https://ui-avatars.com/api/?background=0d6efd&color=fff&name=' +
        encodeURIComponent(currentUser.name);

    $('#profileAvatar').attr('src', avatar);
    $('#navAvatar').attr('src', avatar);

    // Load transactions
    let myTx = transactions.filter(tx =>
        tx.userId === currentUser.id
    ).reverse();

    if (myTx.length === 0) {
        $('#txList').html(`
            <tr>
                <td colspan="4" class="text-center text-muted">
                    No transactions yet
                </td>
            </tr>
        `);
    } else {
        $('#txList').html(
            myTx.map(tx => `
                <tr>
                    <td>${tx.date}</td>
                    <td>${tx.type}</td>
                    <td>${tx.currency} ${parseFloat(tx.amount).toFixed(2)}</td>
                    <td>
                        <span class="badge bg-success">
                            ${tx.status}
                        </span>
                    </td>
                </tr>
            `).join('')
        );
    }
}

// ==================== INITIAL LOAD ====================
loadAllData();

// ==================== STORAGE SYNC ====================
window.addEventListener('storage', () => {
    loadAllData();
});

// ==================== REGISTER ====================
$('#registerForm').on('submit', async function(e) {
    e.preventDefault();

    loadAllData();

    let name = $('#regName').val().trim();
    let username = $('#regUsername').val().trim().toLowerCase();
    let email = $('#regEmail').val().trim().toLowerCase();
    let password = $('#regPassword').val().trim();
    let pin = $('#regPin').val().trim();
    let transPin = $('#regTransPin').val().trim();
    let currency = $('#regCurrency').val();

    // Validation
    if (!name || !username || !email || !password || !pin || !transPin) {
        return Swal.fire(
            'Missing Fields',
            'Please complete all fields.',
            'error'
        );
    }

    if (password.length < 4) {
        return Swal.fire(
            'Weak Password',
            'Password must be at least 4 characters.',
            'error'
        );
    }

    if (!/^\d{4}$/.test(pin)) {
        return Swal.fire(
            'Invalid PIN',
            'Login PIN must be exactly 4 digits.',
            'error'
        );
    }

    if (!/^\d{4}$/.test(transPin)) {
        return Swal.fire(
            'Invalid PIN',
            'Transaction PIN must be exactly 4 digits.',
            'error'
        );
    }

    // Check existing user
    if (usersDB.some(u => u.username === username)) {
        return Swal.fire(
            'Username Exists',
            'Choose another username.',
            'error'
        );
    }

    if (usersDB.some(u => u.email === email)) {
        return Swal.fire(
            'Email Exists',
            'Email already registered.',
            'error'
        );
    }

    // Photo upload
    let avatar = null;

    let photoFile = $('#regPhoto')[0].files[0];

    if (photoFile) {
        avatar = await new Promise(resolve => {
            let reader = new FileReader();

            reader.onload = e => resolve(e.target.result);

            reader.readAsDataURL(photoFile);
        });
    }

    // Create user
    let newUser = {
        id: Date.now(),
        name,
        username,
        email,
        password,
        pin,
        transPin,
        role: 'user',
        balance: 0.00,
        accountNumber: generateAccountNumber(),
        routing: '760965735',
        swift: 'CRIBUS33',
        status: 'active',
        currency,
        avatar,
        createdAt: new Date().toISOString()
    };

    usersDB.push(newUser);

    saveAllData();

    Swal.fire({
        icon: 'success',
        title: 'Account Created',
        html: `
            Welcome ${newUser.name}<br><br>
            Account Number:<br>
            <strong>${newUser.accountNumber}</strong>
        `
    });

    $('#registerForm')[0].reset();

    $('#registerForm').hide();
    $('#loginForm').show();
});

// ==================== LOGIN SYSTEM ====================
$('#loginForm').on('submit', async function(e) {
    e.preventDefault();

    loadAllData();

    let loginInput = $('#loginUsername').val().trim().toLowerCase();
    let password = $('#loginPassword').val().trim();
    let enteredPin = $('#loginPin').val().trim();

    if (!loginInput || !password || !enteredPin) {
        return Swal.fire({
            icon: 'error',
            title: 'Missing Details',
            text: 'Please fill all login fields.'
        });
    }

    // Find user
    let foundUser = usersDB.find(user => {
        return (
            (
                user.username.toLowerCase() === loginInput ||
                user.email.toLowerCase() === loginInput
            ) &&
            user.password === password &&
            user.role !== 'admin'
        );
    });

    if (!foundUser) {
        return Swal.fire({
            icon: 'error',
            title: 'Login Failed',
            text: 'Invalid username/email or password.'
        });
    }

    // PIN check
    if (foundUser.pin !== enteredPin) {
        return Swal.fire({
            icon: 'error',
            title: 'Invalid PIN',
            text: 'Incorrect 4-digit login PIN.'
        });
    }

    // Status check
    if (foundUser.status !== 'active') {
        return Swal.fire({
            icon: 'warning',
            title: 'Account Restricted',
            text: 'Your account is inactive.'
        });
    }

    // Save session
    currentUser = foundUser;

    localStorage.setItem(
        'citi_bank_user_session',
        JSON.stringify({
            id: foundUser.id,
            username: foundUser.username,
            email: foundUser.email,
            loginTime: new Date().toISOString()
        })
    );

    refreshUserUI();

    $('#authContainer').fadeOut(300, function() {
        $('#userPanel').fadeIn(300);
    });

    Swal.fire({
        icon: 'success',
        title: 'Login Successful',
        text: `Welcome back, ${foundUser.name}!`,
        timer: 1800,
        showConfirmButton: false
    });
});

// ==================== SESSION RESTORE ====================
(function restoreSession() {

    loadAllData();

    let savedSession =
        localStorage.getItem('citi_bank_user_session');

    if (!savedSession) return;

    try {

        let session = JSON.parse(savedSession);

        let existingUser = usersDB.find(
            u => u.id === session.id
        );

        if (existingUser && existingUser.status === 'active') {

            currentUser = existingUser;

            $('#authContainer').hide();

            $('#userPanel').show();

            refreshUserUI();

        } else {

            localStorage.removeItem(
                'citi_bank_user_session'
            );

        }

    } catch (err) {

        console.error(err);

        localStorage.removeItem(
            'citi_bank_user_session'
        );
    }

})();

// ==================== LOGOUT ====================
function logoutUser() {

    currentUser = null;

    localStorage.removeItem('citi_bank_user_session');

    $('#userPanel').hide();

    $('#authContainer').fadeIn(300);
}

$('#logoutBtnUser').click(function() {
    logoutUser();
});

// ==================== TOGGLE FORMS ====================
$('#showRegisterBtn').click(function(e) {
    e.preventDefault();
    $('#loginForm').hide();
    $('#registerForm').show();
});

$('#showLoginBtn').click(function(e) {
    e.preventDefault();
    $('#registerForm').hide();
    $('#loginForm').show();
});

// ==================== PRELOADER ====================
$(window).on('load', function() {
    setTimeout(() => {
        $('#preloader').fadeOut(500);
    }, 400);
});
</script>
